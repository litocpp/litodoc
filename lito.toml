[workspace]
name = "litodoc"
members = ["core", "web", "protocol", "book", "tests"]
default-members = ["book"]

[workspace.package]
version = "0.2.0"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[workspace.dependencies]
litodoc-core = { path = "core" }
litodoc-web = { path = "web" }
licrypto = "0.1.0"
rstd-std = "0.1.0"
rstd-json = "0.1.0"
rstd-serde = "0.1.0"
rstd-toml = "0.1.0"
rstd-argparse = "0.1.0"
rstd-test = "0.1.0"

[profile]
exceptions = false
rtti = false
