[package]
name = "litodoc-core"
version.workspace = true

[lib]
name = "litodoc-core"
module = "lito.doc"
archive = "lito.doc"
sources = [
  "src/site/html.cppm",
  "src/site/templates/mod.cppm",
  "src/site/frontend/mod.cppm",
  "src/site/publication.cppm",
  "src/site/lib.cppm",
  "src/doc/model.cppm",
  "src/doc/database.cppm",
  "src/doc/data/mod.cppm",
  "src/doc/markdown.cppm",
  "src/doc/render.cppm",
  "src/doc/publish.cppm",
  "src/doc/lib.cppm",
  "src/book/model.cppm",
  "src/book/project.cppm",
  "src/book/summary.cppm",
  "src/book/markdown.cppm",
  "src/book/graph.cppm",
  "src/book/data.cppm",
  "src/book/render.cppm",
  "src/book/lib.cppm",
]

[build-tools.esbuild]
version = "0.28.1"
executable = "bin/esbuild"

[build-tools.esbuild.archives.linux-x86_64]
url = "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz"
sha256 = "9ed00ab5330c94386f3273eda99a1fb0e8f37cfd6cb5270e4ad2fe3527da3546"

[build-tools.esbuild.archives.linux-aarch64]
url = "https://registry.npmjs.org/@esbuild/linux-arm64/-/linux-arm64-0.28.1.tgz"
sha256 = "2145e9e686c95ee47c1181f83f272f0ff95820e52d7736fdcd9eeb106fd6456a"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-json]
workspace = true
visibility = "private"

[dependencies.rstd-toml]
workspace = true
visibility = "private"
