      {{#if site.has_footer}}<footer class="site-footer">
        {{#if site.has_footer_text}}<p>{{site.footer_text}}</p>{{/if}}
        {{#if site.has_footer_links}}<nav aria-label="Footer links">{{#each site.footer_links}}<a href="{{href}}">{{label}}</a>{{/each}}</nav>{{/if}}
      </footer>{{/if}}
    </main>
    {{#if page.has_outline}}
    <aside class="page-outline" aria-label="On this page">
      <lito-doc-navigation>
        <div class="sidebar-section" data-navigation-section>
          <div class="sidebar-heading">On This Page</div>
          <nav data-outline-navigation>
            <ul class="nav-list outline-list">
              {{#each page.outline}}<li data-depth="{{level}}"><a href="{{href}}">{{label}}</a></li>{{/each}}
            </ul>
          </nav>
        </div>
      </lito-doc-navigation>
    </aside>
    {{/if}}
    <div class="page-outline-placeholder" aria-hidden="true"></div>
  </div>
  </lito-doc-shell>
</body>
</html>
