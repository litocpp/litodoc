{{> templates/partials/head.html}}
<lito-doc-module-identity variant="module">
  <nav aria-label="Module identity">
    <a href="{{page.asset_prefix}}index.html">workspace</a><span aria-hidden="true">→</span><strong>{{package.name}}</strong>
  </nav>
</lito-doc-module-identity>
<h1 class="page-title">{{package.name}}</h1>
{{#if package.has_documentation}}<lito-doc-prose><section class="documentation prose" id="documentation">{{{package.documentation}}}</section></lito-doc-prose>{{/if}}
<section class="api-section" id="modules">
  <div class="section-heading"><span>Modules</span><span>{{package.module_count}}</span></div>
  <ul class="api-list">
    {{#each modules}}<li><a href="{{href}}"><code>{{label}}</code></a></li>{{/each}}
  </ul>
</section>
{{> templates/partials/foot.html}}
