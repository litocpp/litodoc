<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Tenon">
  <title>{{page.title}} · {{site.title}}</title>
  <link rel="stylesheet" href="{{page.asset_prefix}}static/style.css">
  <script src="{{page.asset_prefix}}static/theme-bootstrap.js"></script>
  <script src="{{page.asset_prefix}}static/search-index.js"></script>
  <script defer src="{{page.asset_prefix}}static/app.js"></script>
</head>
<body data-root-prefix="{{page.asset_prefix}}" data-page-kind="{{page.kind}}">
  <a class="skip-link" href="#content">Skip to documentation</a>
  <header class="topbar">
    <button class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">
      <span aria-hidden="true">☰</span><span class="sr-only">Open module navigation</span>
    </button>
    <a class="brand" href="{{page.asset_prefix}}index.html">
      <span class="brand-mark" aria-hidden="true">:</span>
      <span>Tenon docs</span>
    </a>
    <div class="search-control">
      <label for="doc-search">Search API</label>
      <input id="doc-search" type="search" autocomplete="off" spellcheck="false" placeholder="Symbol or module">
      <div id="search-results" class="search-results" hidden aria-live="polite"></div>
    </div>
    <label class="theme-control" for="theme-mode">
      <span>Theme</span>
      <select id="theme-mode">
        <option value="auto">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </header>
  <div class="doc-shell">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-heading">Packages</div>
      <nav>
        <ul class="nav-list">
          {{#each navigation.packages}}<li><a href="{{href}}">{{name}} <span>{{version}}</span></a></li>{{/each}}
        </ul>
      </nav>
      {{#if navigation.has_modules}}
      <div class="sidebar-heading sidebar-heading-modules">Modules</div>
      <nav>
        <ul class="nav-list module-list">
          {{#each navigation.modules}}<li><a href="{{href}}"><code>{{name}}</code></a></li>{{/each}}
        </ul>
      </nav>
      {{/if}}
    </aside>
    <main id="content" class="content">
