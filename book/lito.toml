[package]
name = "litobook"
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "litobook-preview"
module = "lito.book.preview"
archive = "lito.book.preview"
sources = ["src/preview.cppm"]

[[bin]]
name = "litobook"
module = "litobook.executable"
sources = ["src/runner.cppm", "src/tool.cppm", "src/main.cppm"]

[dependencies.litodoc-core]
workspace = true
visibility = "private"

[dependencies.litodoc-web]
workspace = true
visibility = "private"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-argparse]
workspace = true
visibility = "private"

[dependencies.liserveto]
workspace = true
visibility = "public"
