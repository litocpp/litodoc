[package]
name = "litodoc"
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "litodoc"
module = "litodoc.executable"
sources = ["src/tool.cppm", "src/main.cppm"]

[dependencies.litodoc-core]
workspace = true
visibility = "private"

[dependencies.litodoc-web]
workspace = true
visibility = "private"

[dependencies.rstd-std]
workspace = true
visibility = "private"

[dependencies.rstd-json]
workspace = true
visibility = "private"

[dependencies.rstd-argparse]
workspace = true
visibility = "private"

[dependencies.licrypto]
workspace = true
visibility = "private"

[external-dependencies.cmake.clang]
package = "Clang"
adapter = "cmake/clang.cmake"
targets = [
  { name = "Litodoc::Clang", visibility = "private" },
]
